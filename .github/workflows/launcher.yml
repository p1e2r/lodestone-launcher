name: Launcher

# Builds on every push. To publish a release, open Actions → Launcher →
# Run workflow and tick "release" (the version comes from Cargo.toml), or push
# a tag `v<version>`.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release for the version in Cargo.toml"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-intel
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
          # Oldest supported Ubuntu, so the binary runs on older glibc too.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          # Include the runner OS so caches built against a different glibc are never reused.
          key: ${{ matrix.os }}-${{ matrix.target }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig1-dev libfreetype-dev libxcb1-dev
      - name: Test
        # The Intel Mac build is cross-compiled on Apple Silicon, so its tests can't run natively.
        if: matrix.name != 'macos-intel'
        run: cargo test --release --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          APP=dist/Lodestone.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/${{ matrix.target }}/release/lodestone "$APP/Contents/MacOS/Lodestone"
          lipo -info "$APP/Contents/MacOS/Lodestone"
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          # App icon
          ICONSET=dist/AppIcon.iconset
          mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z $d $d assets/icon.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Lodestone</string>
            <key>CFBundleDisplayName</key><string>Lodestone</string>
            <key>CFBundleIdentifier</key><string>dev.p1e2r.lodestone</string>
            <key>CFBundleExecutable</key><string>Lodestone</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          codesign --force --deep --sign - "$APP"
          # Bridge: 0.1.3/0.1.4 can only update from a .zip, so 0.1.5 still ships one.
          # From 0.1.6 on, macOS is DMG-only (the updater uses the DMG).
          if [ "$VERSION" = "0.1.5" ]; then
            (cd dist && ditto -c -k --keepParent Lodestone.app Lodestone-${{ matrix.name }}.zip)
          fi
          # .dmg with a drag-to-Applications window
          DMG_DIR=dist/dmg
          mkdir -p "$DMG_DIR"
          cp -R "$APP" "$DMG_DIR/"
          ln -s /Applications "$DMG_DIR/Applications"
          hdiutil create -volname "Lodestone" -srcfolder "$DMG_DIR" -ov -format UDZO "dist/Lodestone-${{ matrix.name }}.dmg"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: mkdir -p dist && cp target/${{ matrix.target }}/release/lodestone.exe dist/Lodestone-${{ matrix.name }}.exe
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" installer\windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/lodestone dist/lodestone
          cp assets/icon.png dist/lodestone.png
          tar -czf dist/Lodestone-${{ matrix.name }}.tar.gz -C dist lodestone lodestone.png
      - uses: actions/upload-artifact@v4
        with:
          name: Lodestone-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.exe
            dist/*.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          ls -la artifacts
          cat > notes.md <<EOF
          ## Downloads

          | Platform | Download |
          |----------|----------|
          | Windows 10/11 (64-bit) | \`Lodestone-windows-x64-setup.exe\` (installer) |
          | macOS, Apple Silicon (M1 and newer) | \`Lodestone-macos-arm64.dmg\` |
          | macOS, Intel | \`Lodestone-macos-intel.dmg\` |
          | Linux (x86_64) | \`Lodestone-linux-x64.tar.gz\` |

          The plain \`.exe\` is what the in-app updater uses on Windows.

          **Windows:** the installer needs no admin rights. It installs to \`%LOCALAPPDATA%\\Programs\\Lodestone\` with a Start Menu entry. SmartScreen may warn about an unknown publisher: choose *More info → Run anyway*.

          **macOS:** open the DMG and drag Lodestone to Applications. The app isn't notarized, so run this once in Terminal:

          \`\`\`sh
          xattr -dr com.apple.quarantine /Applications/Lodestone.app
          \`\`\`

          **Updating from an older version:** click *Update* in Lodestone. It installs the new version, moves itself to your programs folder if it isn't there already, and keeps all your instances, worlds, accounts and settings.

          macOS 12 or newer is required.
          EOF
          gh release create "v${VERSION}" artifacts/* \
            --target "$GITHUB_SHA" \
            --title "Lodestone ${VERSION}" \
            --notes-file notes.md
