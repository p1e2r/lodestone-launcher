[package]
name = "lodestone"
version = "0.1.6"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["clock"] }
directories = "6.0.0"
futures = "0.3.34"
gpui-kit = "0.9.1"
hex = "0.4.3"
image = { version = "0.25", default-features = false, features = ["png"] }
md-5 = "0.11.0"
open = "5.4.5"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }
tokio = { version = "1.54.1", features = ["full"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1.34"
